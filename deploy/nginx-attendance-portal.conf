# Nginx for the AIBIZTECH instance of Attendance (PM2 process "attendance-portal" on localhost:3100).
# Use a NEW subdomain, e.g. attendance-portal.yourdomain.com, with an A record to this VPS; the portal forwards /attendance to it.
#   sudo cp nginx-attendance-portal.conf /etc/nginx/sites-available/attendance-portal
#   sudo ln -s /etc/nginx/sites-available/attendance-portal /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d attendance-portal.yourdomain.com
server {
    listen 80;
    server_name attendance-portal.yourdomain.com;

    location / {
        proxy_pass http://localhost:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20m;
    }
}
