name: Build Android APK

# Builds a new release APK whenever mobile-app/ changes on main, and
# publishes it as a GitHub Release so the app itself (see
# mobile-app/src/lib/useUpdateCheck.ts) can notice a newer version exists
# and prompt the user to download it — no more manually rebuilding and
# hand-delivering an APK after every code change.
on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

# The default GITHUB_TOKEN is read-only unless a workflow says otherwise —
# without this, "Publish GitHub Release" fails immediately (403) the moment
# it tries to create the release, right after a successful APK build.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action's default packages are "tools platform-tools", but the
      # legacy "tools" package no longer exists in current cmdline-tools —
      # sdkmanager exits 1 on it and fails the whole build before it starts.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      # 100 + run number keeps this comfortably ahead of every versionCode
      # already shipped by hand earlier in development (up to 7), and keeps
      # climbing forever after — Android refuses to treat a lower/equal
      # versionCode as an update, so this must never go backwards.
      - name: Compute version
        id: version
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$CODE" >> "$GITHUB_OUTPUT"

      - name: Stamp app.json with this build's version
        working-directory: mobile-app
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.version = '${{ steps.version.outputs.name }}';
            j.expo.android.versionCode = ${{ steps.version.outputs.code }};
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2) + '\n');
          "

      # Regenerates android/ fresh from app.json + the config plugins every
      # run, instead of relying on a hand-maintained native folder (that's
      # what caused versionCode edits to silently do nothing earlier in
      # this project's history — app.json here is the only source of truth).
      - name: Prebuild native Android project
        working-directory: mobile-app
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # Signs with the same debug keystore every local build this session
      # used, so this release can update those existing installs in place
      # instead of colliding as "a different app" over signature mismatch.
      - name: Restore signing keystore
        working-directory: mobile-app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/debug.keystore

      - name: Build release APK
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.code }}
          name: v${{ steps.version.outputs.code }}
          files: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
